name: DAE Economic Engine
on:
  pull_request:
    paths:
      - "dae_economy/**"
      - "tests/test_dae_economy_engine.py"
      - ".github/workflows/dae-economic-engine.yml"
  push:
    branches: [main]
    paths:
      - "dae_economy/**"
      - "tests/test_dae_economy_engine.py"
      - ".github/workflows/dae-economic-engine.yml"

permissions:
  contents: read

jobs:
  test-economic-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile package
        run: python -m compileall -q dae_economy
      - name: Run economic engine tests
        run: python -m pytest -q tests/test_dae_economy_engine.py
      - name: Run local demo
        run: python -m dae_economy.cli demo
